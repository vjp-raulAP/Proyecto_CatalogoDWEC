<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de repuestos</title>

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="./css/estilos.css">

    <!-- JavaScript -->
    <script src="./js/app.js" defer></script>
</head>
<body>

    <h1>Catálogo de repuestos de coche</h1>

    <p>
        Aplicación para gestionar un catálogo de repuestos de coche.
    </p>

    <!-- Buscador y botones para ordenar -->
    <section class="controles">

        <input id="buscador" type="search" placeholder="Buscar...">

        <button id="ordenNombre" type="button">
            Ordenar A-Z
        </button>

        <button id="ordenPrecio" type="button">
            Ordenar por precio
        </button>

    </section>

    <!-- Resumen del catálogo -->
    <section>
        <h2>Resumen</h2>
        <p id="resumen"></p>
        <p id="estadisticas"></p>
    </section>

    <!-- Aquí aparecerán las tarjetas -->
    <section>
        <h2>Listado de repuestos</h2>
        <div id="listado"></div>
    </section>

</body>
</html>
